<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="456" viewBox="0 0 1200 456" role="img" aria-labelledby="title desc"><title id="title">Divisions</title><desc id="desc">Hyperloop AI, Hyperloop Cooling, Hyperloop Space, Hyperloop Robotics, Hyperloop Transit, Hyperprint.</desc><style>
 .hair{fill:none;stroke:#343434;stroke-width:1;stroke-linecap:round;vector-effect:non-scaling-stroke}
 .branch{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 3.8s cubic-bezier(.16,1,.3,1) both}
 .node{fill:none;stroke:#b6b6b6;stroke-width:1;vector-effect:non-scaling-stroke}
 .label{fill:#f0f0f0;font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:29px;font-weight:400;letter-spacing:-.25px;opacity:1;animation:arrive 2s ease-out both}
 @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
 @keyframes arrive{from{opacity:.38}to{opacity:1}}
 @media(max-width:600px){.label{font-size:48px;letter-spacing:-.5px}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}.branch{stroke-dashoffset:0}.label{opacity:1}}
 </style><path class="hair branch" pathLength="1" d="M48 58V398"/><path class="hair branch" pathLength="1" style="animation-delay:0.20s" d="M48 58H86"/><circle class="node" cx="48" cy="58" r="2.3"/><text class="label" x="112" y="68" style="animation-delay:0.48s">Hyperloop AI</text><path class="hair branch" opacity=".5" pathLength="1" style="animation-delay:0.80s" d="M700 58H1152"/><path class="hair branch" pathLength="1" style="animation-delay:0.48s" d="M48 126H86"/><circle class="node" cx="48" cy="126" r="2.3"/><text class="label" x="112" y="136" style="animation-delay:0.76s">Hyperloop Cooling</text><path class="hair branch" opacity=".5" pathLength="1" style="animation-delay:1.08s" d="M700 126H1152"/><path class="hair branch" pathLength="1" style="animation-delay:0.76s" d="M48 194H86"/><circle class="node" cx="48" cy="194" r="2.3"/><text class="label" x="112" y="204" style="animation-delay:1.04s">Hyperloop Space</text><path class="hair branch" opacity=".5" pathLength="1" style="animation-delay:1.36s" d="M700 194H1152"/><path class="hair branch" pathLength="1" style="animation-delay:1.04s" d="M48 262H86"/><circle class="node" cx="48" cy="262" r="2.3"/><text class="label" x="112" y="272" style="animation-delay:1.32s">Hyperloop Robotics</text><path class="hair branch" opacity=".5" pathLength="1" style="animation-delay:1.64s" d="M700 262H1152"/><path class="hair branch" pathLength="1" style="animation-delay:1.32s" d="M48 330H86"/><circle class="node" cx="48" cy="330" r="2.3"/><text class="label" x="112" y="340" style="animation-delay:1.60s">Hyperloop Transit</text><path class="hair branch" opacity=".5" pathLength="1" style="animation-delay:1.92s" d="M700 330H1152"/><path class="hair branch" pathLength="1" style="animation-delay:1.60s" d="M48 398H86"/><circle class="node" cx="48" cy="398" r="2.3"/><text class="label" x="112" y="408" style="animation-delay:1.88s">Hyperprint</text><path class="hair branch" opacity=".5" pathLength="1" style="animation-delay:2.20s" d="M700 398H1152"/></svg>
